[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"
  NPM_FLAGS = "--omit=dev"

[functions]
  node_bundler = "esbuild"

# Episode/poem pages are served live from this function instead of the static file
# saved during the last deploy, so editing a post in the Write page shows up on
# the next page view immediately -- no rebuild, no deploy, no credits spent.
[[redirects]]
  from = "/read/:slug.html"
  to = "/.netlify/functions/read"
  status = 200
  force = true
  query = {slug = ":slug"}

[[headers]]
  for = "/write/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "no-store"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Short link for the paid-member mailing address page
[[redirects]]
  from = "/mail"
  to = "/mail.html"
  status = 200
  
[[redirects]]
  from = "/store"
  to = "/store.html"
  status = 200
